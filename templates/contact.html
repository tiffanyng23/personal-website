{% extends "base.html" %}

{% block title %} Contact {% endblock title %}

{% block body %}
<h3 class="mt-4">Feel free to contact me if you are interested in connecting!</h3>
<div class="form-container mt-3">
    <form action="/contact" method="POST">
        <div class="meta-email">
            <label for="email">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="subject">Email: </label>
            <input type="text" id="email" name="user_email" required>
        </div>
        <div class="mt-3">
            <label for="subject"> Subject: </label>
            <input type="text" id="subject" name="subject" required>
            <br>
            <label for="message"> Message: </label>
            <br>
            <textarea id="message" name="message" cols="120" required></textarea>
            <br>
            <button type="submit">Send</button>
        </div>
    </form>
</div>


{% endblock body %}
